name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Skill Validation Script
        run: |
          chmod +x install.sh scripts/sync.sh scripts/validate-skill.mjs
          node scripts/validate-skill.mjs

      - name: Test Installer Dry-Run
        run: |
          ./install.sh --dry-run
